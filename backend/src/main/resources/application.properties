spring.config.import=optional:file:./.env[.properties]
spring.application.name=due-diligence-agent

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_due_diligence
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

logging.level.org.springframework.security=DEBUG
server.port=8080

# ═══════════════════════════════════════════════════════════════
# Gmail SMTP Configuration (for password reset emails)
# ═══════════════════════════════════════════════════════════════
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender identity
app.mail.from=${MAIL_USERNAME}
app.mail.from-name=Real Estate Due Diligence

# Google OAuth (Sign in with Google)
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# ── Actuator: expose safe endpoints only ──────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true

# Info endpoint metadata
info.app.name=Real Estate Due Diligence Agent
info.app.version=1.0.0
info.app.description=Backend API for real estate due diligence platform

# Admin user credentials (for initial setup)
app.admin.email=admin@realestate.com
app.admin.password=Admin@123
app.admin.full-name=System Admin
app.admin.phone-number=9876543210

# ── Cashfree Payment Gateway (sandbox) ──────────────────────────
# Credentials come from backend/.env — never commit real keys.
cashfree.app-id=${CASHFREE_APP_ID:}
cashfree.secret-key=${CASHFREE_SECRET_KEY:}
cashfree.environment=${CASHFREE_ENV:sandbox}
cashfree.webhook-secret=${CASHFREE_WEBHOOK_SECRET:}