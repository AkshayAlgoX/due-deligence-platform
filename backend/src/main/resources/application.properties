spring.config.import=optional:file:./.env[.properties]
spring.application.name=due-diligence-agent
 
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_due_diligence
spring.datasource.username=postgres
spring.datasource.password=bhavanabhat@123
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# JWT Configuration
jwt.secret=ThisIsMySuperSecretKeyForDueDiligenceProject2026SpringBootJWTAuthentication
jwt.expiration=3600000
 
logging.level.org.springframework.security=DEBUG
server.port=8080
 
# ═══════════════════════════════════════════════════════════════
# Gmail SMTP Configuration (for password reset emails)
# ═══════════════════════════════════════════════════════════════
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
 
# Sender identity
app.mail.from=${MAIL_USERNAME}
app.mail.from-name=Real Estate Due Diligence
 
# Google OAuth (Sign in with Google)
google.oauth.client-id=${GOOGLE_CLIENT_ID}