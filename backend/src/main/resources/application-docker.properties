# application-docker.properties — Docker-only profile.
# Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml).
# Overrides application.properties; every external value comes from the environment.
# The host application.properties is untouched.

# ── Database (compose sets SPRING_DATASOURCE_* from .env) ─────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA ──────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Server / actuator (healthcheck + probes) ────────────────────────
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ── Logging ──────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.realestate=DEBUG

# ── JWT ──────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ── External APIs ────────────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY:}
cashfree.app-id=${CASHFREE_APP_ID:}
cashfree.secret-key=${CASHFREE_SECRET_KEY:}
cashfree.environment=${CASHFREE_ENV:sandbox}

# ── Google OAuth ─────────────────────────────────────────────────────
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# ── Mail (SMTP) ──────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_USERNAME:}
app.mail.from-name=Real Estate Due Diligence

# ── App URLs & Admin ─────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.backend.url=${BACKEND_URL:http://localhost:8080}
app.admin.email=${ADMIN_EMAIL:admin@realestate.com}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Admin}
app.admin.phone-number=${ADMIN_PHONE_NUMBER:9876543210}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

